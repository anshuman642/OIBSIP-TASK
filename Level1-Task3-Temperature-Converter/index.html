
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Temperature Converter</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>
<body>

    <main class="converter">
        <div class="thermometer">🌡️</div>

        <p class="subtitle">SMART TEMPERATURE TOOL</p>
        <h1>Temperature <span>Converter</span></h1>

        <p class="description">
            Convert temperatures between Celsius, Fahrenheit and Kelvin.
        </p>

        <form id="converterForm">
            <label for="temperature">Enter temperature</label>

            <input
                type="number"
                id="temperature"
                placeholder="e.g. 25"
                step="any"
                required
            >

            <label for="fromUnit">Convert from</label>

            <select id="fromUnit">
                <option value="C">Celsius (°C)</option>
                <option value="F">Fahrenheit (°F)</option>
                <option value="K">Kelvin (K)</option>
            </select>

            <button type="submit">Convert Temperature →</button>
            <button type="button" id="resetButton" class="reset-button">
                Reset
            </button>
        </form>

        <p id="errorMessage" class="error" role="alert"></p>

        <section id="results" class="results" aria-live="polite" hidden>
            <h2>Conversion Results</h2>

            <div class="result-card">
                <span>Celsius</span>
                <strong id="celsiusResult">—</strong>
            </div>

            <div class="result-card">
                <span>Fahrenheit</span>
                <strong id="fahrenheitResult">—</strong>
            </div>

            <div class="result-card">
                <span>Kelvin</span>
                <strong id="kelvinResult">—</strong>
            </div>
        </section>

        <footer>
            Built with HTML, CSS & JavaScript
        </footer>
    </main>

</body>
</html>
